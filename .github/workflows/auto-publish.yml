name: auto-publish

# 평일 09:17 KST (00:17 UTC) 하루 1포스트 로테이션
# 월=repo-retrospect, 화=planning-insight, 수=data-statistics, 목=trend-research, 금=business-economy
on:
  schedule:
    - cron: "17 0 * * 1-5"
  workflow_dispatch:
    inputs:
      task:
        description: "실행할 작업 (비우면 요일별 자동 선택). 예: auto-publish planning-insight 또는 repo-retrospect"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 요일별 작업 선택 (KST 기준)
        id: pick
        env:
          MANUAL_TASK: ${{ inputs.task }}
        run: |
          TASK="$MANUAL_TASK"
          if [ -z "$TASK" ]; then
            case "$(TZ=Asia/Seoul date +%u)" in
              1) TASK="repo-retrospect" ;;
              2) TASK="auto-publish planning-insight" ;;
              3) TASK="auto-publish data-statistics" ;;
              4) TASK="auto-publish trend-research" ;;
              5) TASK="auto-publish business-economy" ;;
              *) TASK="" ;;
            esac
          fi
          if [ -z "$TASK" ]; then
            echo "주말 — 실행할 작업 없음"
          fi
          echo "prompt=${TASK:+/$TASK}" >> "$GITHUB_OUTPUT"

      - name: 발행 전 기준 커밋 기록
        if: steps.pick.outputs.prompt != ''
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Ruby 3.1 고정: Gemfile.lock의 liquid 4.0.3이 Ruby 3.2에서 제거된
      # Object#tainted?를 호출해 3.3에서는 빌드가 항상 실패했다
      # (failures/registry.md 2026-07-31). 실제 배포 빌드는 GitHub Pages가 수행.
      - name: Ruby 설치 (Jekyll 빌드 검증용)
        if: steps.pick.outputs.prompt != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Git 커밋 identity 설정
        if: steps.pick.outputs.prompt != ''
        run: |
          git config user.name "이도현"
          git config user.email "227864403+dorec9@users.noreply.github.com"

      - name: Claude Code 발행 파이프라인 실행
        if: steps.pick.outputs.prompt != ''
        uses: anthropics/claude-code-action@v1
        env:
          # REPO_SCAN_TOKEN: private 레포 조회용 PAT (대상 레포에 Contents/Metadata Read).
          # github.token은 이 레포에만 유효해 다른 레포는 public만 읽힌다 —
          # private 회고를 하려면 이 secret이 필요하다. 미설정 시 폴백되어 public만 동작한다.
          GH_TOKEN: ${{ secrets.REPO_SCAN_TOKEN || github.token }}
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          bot_name: "dorec9"
          bot_id: "227864403"
          prompt: ${{ steps.pick.outputs.prompt }}
          claude_args: "--max-turns 120 --permission-mode bypassPermissions"

      # 무발행 방어: 세션 종료 코드가 아니라 결과물(_posts/ 변경)로 성공을 판정한다.
      # 2026-08-07~26 사이 무발행 실행 4회가 success로 기록돼 3주간 미탐지된 사고의 재발 방지
      # (failures/registry.md 2026-08-27 기록 참조)
      - name: 발행 결과 검증 (무발행 시 실패 처리)
        if: steps.pick.outputs.prompt != ''
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          PROMPT: ${{ steps.pick.outputs.prompt }}
        run: |
          git fetch origin main
          CHANGED=$(git diff --name-only "$BASE_SHA" origin/main -- _posts/)
          if [ -n "$CHANGED" ]; then
            echo "발행 확인:"
            echo "$CHANGED"
            { echo "✅ 발행된 포스트:"; echo '```'; echo "$CHANGED"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$PROMPT" = "/repo-retrospect" ]; then
            echo "::warning::repo-retrospect: 새 포스트 없음 — 분석할 신규/변경 레포가 없었다면 정상"
            echo "⚠️ repo-retrospect: 새 포스트 없음 (신규/변경 레포 없음이면 정상)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::세션은 끝났지만 _posts/에 새 커밋이 없다 — 무발행. 세션 로그에서 중단 지점을 확인할 것"
          echo "❌ 무발행: _posts/ 변경 없음 ($PROMPT)" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: 실패 알림 이슈 생성
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PROMPT: ${{ steps.pick.outputs.prompt }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "자동 발행 실패: $(TZ=Asia/Seoul date +%F) ${PROMPT:-작업 미정}" \
            --body "$(printf '자동 발행 실행이 실패했다.\n\n- 작업: %s\n- 실행 로그: %s\n\n무발행(스텝은 성공했지만 _posts/ 변경 없음)이거나 스텝 자체 실패다. 로그에서 중단 지점을 확인할 것.' "${PROMPT:-미정}" "$RUN_URL")" \
            || echo "::warning::알림 이슈 생성 실패 — 실행 로그로만 확인 가능"
